<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: gap: content: file: blob:; media-src * 'self' file: content: blob: data:;">
  <title>Zaid Player</title>
  <script src="cordova.js"></script>
  <style>
    :root {
      --bg: #0b0d12;
      --surface: #141821;
      --surface-2: #1d2330;
      --accent: #8b5cf6;
      --accent-2: #ec4899;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #262e3d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); gap: 10px; }
    .icon-btn { background: none; border: none; color: var(--text); font-size: 1.35rem; cursor: pointer; padding: 6px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
    .icon-btn:active { background: var(--surface-2); }
    .brand { font-size: 1.15rem; font-weight: 800; background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .search-box { flex: 1; display: none; background: var(--surface-2); border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; color: var(--text); font-size: 0.9rem; outline: none; }
    .search-box.active { display: block; }

    .tabs { display: flex; overflow-x: auto; background: var(--surface); border-bottom: 1px solid var(--border); scrollbar-width: none; padding: 0 8px; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { padding: 11px 14px; font-size: 0.85rem; font-weight: 600; color: var(--muted); white-space: nowrap; border-bottom: 2px solid transparent; cursor: pointer; }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .content { flex: 1; overflow-y: auto; padding: 14px 16px 95px 16px; }

    .perm-card { background: linear-gradient(135deg, rgba(139,92,246,0.18), rgba(236,72,153,0.15)); border: 1px solid var(--accent); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
    .perm-card h3 { font-size: 1rem; margin-bottom: 6px; }
    .perm-card p { font-size: 0.82rem; color: var(--muted); margin-bottom: 12px; line-height: 1.4; }
    .btn-primary { background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: #fff; border: none; padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 0.85rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); padding: 10px 14px; border-radius: 12px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }

    .home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
    .home-tile { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; cursor: pointer; }
    .home-tile:active { transform: scale(0.98); }
    .home-tile .tile-icon { font-size: 1.5rem; margin-bottom: 8px; }
    .home-tile .tile-title { font-weight: 700; font-size: 0.95rem; }

    .song-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-radius: 12px; margin-bottom: 6px; background: var(--surface); border: 1px solid transparent; cursor: pointer; }
    .song-item.playing { border-color: var(--accent); background: var(--surface-2); }
    .song-art { width: 44px; height: 44px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; margin-right: 12px; }
    .song-meta { flex: 1; min-width: 0; }
    .song-title { font-size: 0.92rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-artist { font-size: 0.76rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

    .mini-player { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface-2); border-top: 1px solid var(--border); padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; z-index: 20; }
    .mini-info { flex: 1; min-width: 0; margin-right: 10px; cursor: pointer; }
    .mini-controls { display: flex; align-items: center; gap: 8px; }
    .play-circle { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: #fff; border: none; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; cursor: pointer; }

    .modal { position: fixed; inset: 0; background: var(--bg); z-index: 50; display: none; flex-direction: column; padding: 18px; overflow-y: auto; }
    .modal.open { display: flex; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .big-art { width: 220px; height: 220px; margin: 10px auto 24px auto; border-radius: 28px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: flex; align-items: center; justify-content: center; font-size: 4.5rem; box-shadow: 0 16px 40px rgba(0,0,0,0.5); }
    .seek-wrap { margin: 16px 0; }
    input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }
    .time-row { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
    .full-controls { display: flex; align-items: center; justify-content: space-around; margin: 20px 0; }
    .big-play { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border: none; font-size: 1.6rem; cursor: pointer; }

    .drawer-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 40; display: none; }
    .drawer-backdrop.open { display: block; }
    .drawer { position: fixed; top: 0; bottom: 0; left: 0; width: 275px; background: var(--surface); z-index: 45; transform: translateX(-100%); transition: transform 0.25s ease; padding: 20px 14px; overflow-y: auto; border-right: 1px solid var(--border); }
    .drawer.open { transform: translateX(0); }
    .drawer-title { font-size: 1.25rem; font-weight: 800; margin-bottom: 18px; padding-left: 8px; }
    .drawer-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; color: var(--text); font-size: 0.92rem; font-weight: 600; cursor: pointer; }
    .drawer-item:active { background: var(--surface-2); }

    .eq-bands { display: flex; justify-content: space-between; gap: 8px; background: var(--surface); padding: 16px; border-radius: 16px; margin: 14px 0; border: 1px solid var(--border); }
    .eq-col { display: flex; flex-direction: column; align-items: center; flex: 1; }
    .eq-col input[type="range"] { writing-mode: bt-lr; -webkit-appearance: slider-vertical; width: 24px; height: 130px; }
    .eq-label { font-size: 0.7rem; color: var(--muted); margin-top: 8px; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .chip { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; }
    .chip.active { border-color: var(--accent); background: var(--accent); color: #fff; }
  </style>
</head>
<body>

  <div class="topbar">
    <button class="icon-btn" onclick="toggleDrawer(true)">☰</button>
    <div class="brand">Zaid Player</div>
    <input type="text" class="search-box" id="searchInput" placeholder="Search songs..." oninput="handleSearch(this.value)" />
    <button class="icon-btn" onclick="toggleSearch()">🔍</button>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('home', this)">Home</div>
    <div class="tab" onclick="switchTab('songs', this)">Songs</div>
  </div>

  <div class="content" id="appContent"></div>

  <div class="mini-player">
    <div class="song-art" onclick="openFullPlayer()">🎵</div>
    <div class="mini-info" onclick="openFullPlayer()">
      <div class="song-title" id="miniTitle">No track selected</div>
      <div class="song-artist" id="miniArtist">Tap Scan Storage</div>
    </div>
    <div class="mini-controls">
      <button class="icon-btn" onclick="prevSong()">⏮</button>
      <button class="play-circle" id="miniPlayBtn" onclick="togglePlay()">▶</button>
      <button class="icon-btn" onclick="nextSong()">⏭</button>
    </div>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop" onclick="toggleDrawer(false)"></div>
  <div class="drawer" id="sideDrawer">
    <div class="drawer-title">Zaid Player Menu</div>
    <div class="drawer-item" onclick="toggleDrawer(false); requestStorageAndScan();">📂 Scan Phone Storage</div>
    <div class="drawer-item" onclick="toggleDrawer(false); openModal('eqModal');">🎚️ Equalizer & Bass Boost</div>
    <div class="drawer-item" onclick="toggleDrawer(false); document.getElementById('folderPicker').click();">📁 Import Audio Files</div>
  </div>

  <div class="modal" id="fullPlayerModal">
    <div class="modal-header">
      <button class="icon-btn" onclick="closeModal('fullPlayerModal')">⌄</button>
      <span style="font-weight:700;font-size:0.9rem;">NOW PLAYING</span>
      <button class="icon-btn" onclick="openModal('eqModal')">🎚️</button>
    </div>
    <div class="big-art">🎶</div>
    <div>
      <h2 id="fullTitle" style="font-size:1.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">No Track</h2>
      <p id="fullArtist" style="color:var(--muted);font-size:0.88rem;margin-top:4px;">Zaid Player</p>
    </div>
    <div class="seek-wrap">
      <input type="range" id="seekBar" value="0" min="0" max="100" oninput="seekAudio(this.value)" />
      <div class="time-row"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
    </div>
    <div class="full-controls">
      <button class="icon-btn" style="font-size:1.6rem;" onclick="prevSong()">⏮</button>
      <button class="big-play" id="fullPlayBtn" onclick="togglePlay()">▶</button>
      <button class="icon-btn" style="font-size:1.6rem;" onclick="nextSong()">⏭</button>
    </div>
  </div>

  <div class="modal" id="eqModal">
    <div class="modal-header">
      <button class="icon-btn" onclick="closeModal('eqModal')">←</button>
      <span style="font-weight:700;">Equalizer</span>
      <button class="btn-secondary" style="padding:6px 10px;font-size:0.75rem;" onclick="applyEqPreset('flat')">Reset</button>
    </div>
    <div class="chip-row" id="eqPresets">
      <button class="chip active" onclick="applyEqPreset('flat', this)">Flat</button>
      <button class="chip" onclick="applyEqPreset('bass', this)">Bass Boost</button>
      <button class="chip" onclick="applyEqPreset('rock', this)">Rock</button>
    </div>
    <div class="eq-bands">
      <div class="eq-col"><input type="range" min="-12" max="12" value="0" id="eq0" oninput="setBand(0, this.value)"><span class="eq-label">60Hz</span></div>
      <div class="eq-col"><input type="range" min="-12" max="12" value="0" id="eq1" oninput="setBand(1, this.value)"><span class="eq-label">230Hz</span></div>
      <div class="eq-col"><input type="range" min="-12" max="12" value="0" id="eq2" oninput="setBand(2, this.value)"><span class="eq-label">910Hz</span></div>
      <div class="eq-col"><input type="range" min="-12" max="12" value="0" id="eq3" oninput="setBand(3, this.value)"><span class="eq-label">3.6kHz</span></div>
      <div class="eq-col"><input type="range" min="-12" max="12" value="0" id="eq4" oninput="setBand(4, this.value)"><span class="eq-label">14kHz</span></div>
    </div>
  </div>

  <input type="file" id="folderPicker" accept="audio/*" multiple style="display:none;" onchange="handleManualFiles(this.files)" />
  <audio id="audioEl" crossorigin="anonymous"></audio>

  <script>
    let songs = JSON.parse(localStorage.getItem('zp_songs')) || [];
    let currentTab = 'home';
    let currentIndex = -1;
    let searchQuery = '';
    let scanStatus = 'Ready to scan device storage';

    const audio = document.getElementById('audioEl');
    let audioCtx, sourceNode, gainNode, filters = [];
    const freqs = [60, 230, 910, 3600, 14000];

    function initAudioEngine() {
      if (audioCtx) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return;
      }
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      sourceNode = audioCtx.createMediaElementSource(audio);
      gainNode = audioCtx.createGain();
      let prevNode = sourceNode;
      freqs.forEach((f, i) => {
        const filter = audioCtx.createBiquadFilter();
        filter.type = i === 0 ? 'lowshelf' : (i === freqs.length - 1 ? 'highshelf' : 'peaking');
        filter.frequency.value = f;
        filter.gain.value = 0;
        prevNode.connect(filter);
        prevNode = filter;
        filters.push(filter);
      });
      prevNode.connect(gainNode);
      gainNode.connect(audioCtx.destination);
    }

    function setBand(idx, val) {
      initAudioEngine();
      if (filters[idx]) filters[idx].gain.value = parseFloat(val);
    }

    function applyEqPreset(name, btn) {
      const map = { flat: [0,0,0,0,0], bass: [8,5,0,0,2], rock: [5,3,-2,4,6] };
      const vals = map[name] || [0,0,0,0,0];
      vals.forEach((v, i) => { document.getElementById('eq' + i).value = v; setBand(i, v); });
      if (btn) {
        document.querySelectorAll('#eqPresets .chip').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
      }
    }

    document.addEventListener('deviceready', () => { if (songs.length === 0) requestStorageAndScan(); }, false);

    function requestStorageAndScan() {
      scanStatus = 'Requesting permission...';
      render();
      if (window.cordova && cordova.plugins && cordova.plugins.permissions) {
        cordova.plugins.permissions.requestPermissions([cordova.plugins.permissions.READ_MEDIA_AUDIO, cordova.plugins.permissions.READ_EXTERNAL_STORAGE], () => scanDeviceStorage(), () => { scanStatus = 'Permission denied.'; render(); });
      } else {
        scanDeviceStorage();
      }
    }

    function scanDeviceStorage() {
      if (!window.resolveLocalFileSystemURL || !window.cordova) {
        scanStatus = 'Use "Import Audio Files" in the menu if testing outside Android.';
        render();
        return;
      }
      scanStatus = 'Scanning device storage...';
      render();
      const found = [];
      const exts = ['.mp3', '.m4a', '.wav', '.flac', '.ogg'];

      window.resolveLocalFileSystemURL(cordova.file.externalRootDirectory, (dirEntry) => {
        let reader = dirEntry.createReader();
        reader.readEntries((entries) => {
          entries.forEach(entry => {
            if (entry.isFile && exts.some(e => entry.name.toLowerCase().endsWith(e))) {
              found.push({ id: entry.nativeURL, title: entry.name.replace(/\.[^/.]+$/, ""), artist: 'Device Audio', url: entry.toURL() });
            }
          });
          songs = found;
          localStorage.setItem('zp_songs', JSON.stringify(songs));
          scanStatus = `Found ${songs.length} tracks.`;
          render();
        });
      }, () => { scanStatus = 'Scan error.'; render(); });
    }

    function handleManualFiles(fileList) {
      const added = Array.from(fileList).map(f => ({ id: f.name, title: f.name.replace(/\.[^/.]+$/, ""), artist: 'Imported', url: URL.createObjectURL(f) }));
      songs = [...songs, ...added];
      localStorage.setItem('zp_songs', JSON.stringify(songs));
      render();
    }

    function playSong(index) {
      if (index < 0 || index >= songs.length) return;
      initAudioEngine();
      currentIndex = index;
      audio.src = songs[index].url;
      audio.play().catch(e => console.log(e));
      updatePlayerUI();
      render();
    }

    function togglePlay() {
      if (currentIndex === -1 && songs.length > 0) { playSong(0); return; }
      initAudioEngine();
      if (audio.paused) audio.play(); else audio.pause();
      updatePlayerUI();
    }

    function nextSong() { if (songs.length > 0) playSong((currentIndex + 1) % songs.length); }
    function prevSong() { if (songs.length > 0) playSong((currentIndex - 1 + songs.length) % songs.length); }

    audio.addEventListener('ended', nextSong);
    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      document.getElementById('seekBar').value = (audio.currentTime / audio.duration) * 100;
      document.getElementById('curTime').textContent = fmtTime(audio.currentTime);
      document.getElementById('durTime').textContent = fmtTime(audio.duration);
    });

    function seekAudio(pct) { if (audio.duration) audio.currentTime = (pct / 100) * audio.duration; }
    function fmtTime(sec) { const m = Math.floor(sec / 60); const s = Math.floor(sec % 60); return `${m}:${s < 10 ? '0' : ''}${s}`; }

    function updatePlayerUI() {
      const s = songs[currentIndex];
      const icon = audio.paused ? '▶' : '❚❚';
      document.getElementById('miniPlayBtn').textContent = icon;
      document.getElementById('fullPlayBtn').textContent = icon;
      if (s) {
        document.getElementById('miniTitle').textContent = s.title;
        document.getElementById('miniArtist').textContent = s.artist;
        document.getElementById('fullTitle').textContent = s.title;
        document.getElementById('fullArtist').textContent = s.artist;
      }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      if (el) el.classList.add('active');
      render();
    }

    function toggleDrawer(open) {
      document.getElementById('sideDrawer').classList.toggle('open', open);
      document.getElementById('drawerBackdrop').classList.toggle('open', open);
    }

    function openModal(id) { document.getElementById(id).classList.add('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }
    function openFullPlayer() { openModal('fullPlayerModal'); }
    function toggleSearch() { document.getElementById('searchInput').classList.toggle('active'); }
    function handleSearch(q) { searchQuery = q.toLowerCase(); render(); }

    function render() {
      const container = document.getElementById('appContent');
      const list = searchQuery ? songs.filter(s => s.title.toLowerCase().includes(searchQuery)) : songs;

      container.innerHTML = `
        <div class="perm-card">
          <h3>📂 Zaid Player Library</h3>
          <p>${scanStatus} (${songs.length} tracks loaded)</p>
          <div style="display:flex;gap:8px;margin-top:10px;">
            <button class="btn-primary" onclick="requestStorageAndScan()">🔄 Scan Storage</button>
            <button class="btn-secondary" onclick="document.getElementById('folderPicker').click()">📁 Import Files</button>
          </div>
        </div>
        ${list.map((s, i) => {
          const realIdx = songs.findIndex(x => x.id === s.id);
          return `
            <div class="song-item ${realIdx === currentIndex ? 'playing' : ''}" onclick="playSong(${realIdx})">
              <div class="song-art">🎵</div>
              <div class="song-meta"><div class="song-title">${s.title}</div><div class="song-artist">${s.artist}</div></div>
            </div>
          `;
        }).join('')}
      `;
    }
    render();
  </script>
</body>
</html>
